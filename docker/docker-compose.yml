version: '1.0'

services:
  odor-monitor-client_build:
    build: ../
    container_name: 'odor-monitor-client_build'
    volumes:
      - dist:/usr/src/app/dist

  odor-monitor-client_web:
    image: nginx
    ports:
      - 80:80
    container_name: 'odor-monitor-client_web'
    restart: unless-stopped
    volumes:
      - dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  dist:
